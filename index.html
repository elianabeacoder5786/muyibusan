  body { background: #F5EDE0; display: flex; justify-content: center; padding: 0; }

    max-width: 390px;
    width: 100%;
    background: #FFF8F0;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .header {

    padding: 18px 16px 14px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -30px; left: 30px;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .brand { font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff; letter-spacing: 1px; opacity: 0.95; }
  .trip-title { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 3px; font-weight: 500; }
  .trip-date { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }

  .day-nav {
    background: #fff;
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 12px;
    border-bottom: 2px solid #FDEBD0;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .day-nav::-webkit-scrollbar { display: none; }
  .day-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid #E8D5C0;
    background: #FFF8F0;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #8B6347;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .day-btn.active { background: #E74C3C; border-color: #E74C3C; color: #fff; }

  .day-content { display: none; padding: 14px 12px 0; }
  .day-content.visible { display: block; }

  .day-header-card {
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .day-header-card.orange { background: linear-gradient(120deg, #F39C12, #E67E22); }
  .day-header-card.red    { background: linear-gradient(120deg, #C0392B, #E74C3C); }
  .day-header-card.teal   { background: linear-gradient(120deg, #16A085, #1ABC9C); }
  .day-header-card.blue   { background: linear-gradient(120deg, #2471A3, #3498DB); }
  .day-header-card.green  { background: linear-gradient(120deg, #1E8449, #27AE60); }
  .day-header-card.purple { background: linear-gradient(120deg, #7D3C98, #9B59B6); }
  .day-header-card.coral  { background: linear-gradient(120deg, #D35400, #E67E22); }
  .day-header-card.navy   { background: linear-gradient(120deg, #1A252F, #2C3E50); }
  .day-header-card.rose   { background: linear-gradient(120deg, #C0392B, #E91E8C); }
  .day-header-card.brown  { background: linear-gradient(120deg, #6E4B3A, #8B6347); }

  .day-main-title { font-size: 16px; font-weight: 700; color: #fff; margin-top: 3px; line-height: 1.4; }
  .day-emoji-row { font-size: 18px; margin-top: 6px; letter-spacing: 3px; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: #9B7653;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 14px 0 8px;
    padding-left: 8px;
    border-left: 3px solid #E67E22;
  }

  .item-card {
    background: #fff;
    border-radius: 12px;
    padding: 11px 13px;
    margin-bottom: 8px;
    border: 1.5px solid #F0E0CC;
    display: flex;
    gap: 10px;
    align-items: flex-start;

  .item-card.sight  { border-left: 4px solid #E67E22; border-color: #FDEBD0; }
  .item-card.trans  { border-left: 4px solid #2471A3; border-color: #D6EAF8; }
  .item-card.tip    { border-left: 4px solid #27AE60; border-color: #D5F5E3; background: #F0FBF4; }
  .item-card.warn   { border-left: 4px solid #F39C12; border-color: #FDEBD0; background: #FFFBF0; }
  .item-card.cafe   { border-left: 4px solid #9B59B6; border-color: #EAD5F4; }
  .item-card.shop   { border-left: 4px solid #16A085; border-color: #D1F2EB; }
  .item-card.night  { border-left: 4px solid #2C3E50; border-color: #D5D8DC; }

  .item-card.trans .item-time { color: #2471A3; }
  .item-card.tip .item-time   { color: #27AE60; }
  .item-card.warn .item-time  { color: #D68910; }
  .item-card.cafe .item-time  { color: #9B59B6; }
  .item-card.shop .item-time  { color: #16A085; }
  .item-card.night .item-time { color: #2C3E50; }

  .item-title { font-size: 13px; font-weight: 700; color: #2C2C2A; line-height: 1.4; }
  .item-sub { font-size: 11px; color: #7F7F7A; margin-top: 3px; line-height: 1.6; }

    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-top: 5px;

  .tag-food  { background: #FADBD8; color: #922B21; }
  .tag-sight { background: #FDEBD0; color: #935116; }
  .tag-trans { background: #D6EAF8; color: #1A5276; }
  .tag-tip   { background: #D5F5E3; color: #196F3D; }
  .tag-cafe  { background: #EAD5F4; color: #6C3483; }
  .tag-shop  { background: #D1F2EB; color: #0E6655; }
  .tag-warn  { background: #FDEBD0; color: #935116; }
  .tag-night { background: #D5D8DC; color: #1C2833; }

  .naver-section {
    background: #fff;
    border-radius: 12px;
    border: 1.5px solid #EBD5C0;
    overflow: hidden;
    margin-bottom: 12px;

  .naver-header {
    background: #2C3E50;
    padding: 9px 13px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    display: flex;

  .naver-row {
    display: flex;
    padding: 8px 12px;
    border-bottom: 1px solid #F0E8DC;
    gap: 8px;
    align-items: flex-start;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

  .naver-row:active { background: #FDEBD0 !important; }
  .naver-row:last-child { border-bottom: none; }
  .naver-row:nth-child(even) { background: #FFF8F2; }
  .naver-place { font-size: 11px; font-weight: 700; color: #5D4037; min-width: 75px; flex-shrink: 0; line-height: 1.4; }
  .naver-name { font-size: 11px; color: #1A5276; font-weight: 500; flex: 1; line-height: 1.4; }
  .naver-note { color: #888; font-size: 10px; }

  .bottom-tip-text { font-size: 11px; color: rgba(255,255,255,0.82); line-height: 1.6; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2C2C2A;
    color: #fff;
    font-size: 12px;
    padding: 9px 18px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .footer-brand {
    text-align: center;
    padding: 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    color: #C0392B;
    opacity: 0.5;
  }
</style>

const nav = document.getElementById('dayNav');
const container = document.getElementById('allDays');
const toastEl = document.getElementById('toast');

const tagLabel = t => ({ food:'美食', sight:'景點', trans:'交通', tip:'提醒', cafe:'咖啡', shop:'購物', warn:'注意', night:'夜間' }[t] || t);

function copyText(text) {
  const cleanText = text;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cleanText).catch(() => fallbackCopy(cleanText));
  } else {
    fallbackCopy(cleanText);
  }
  toastEl.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

days.forEach(day => {
  const btn = document.createElement('button');
  btn.className = 'day-btn' + (day.id === 0 ? ' active' : '');
  btn.textContent = day.btn;
  btn.onclick = () => switchDay(day.id);
  nav.appendChild(btn);

  const wrapper = document.createElement('div');
  wrapper.className = 'day-content' + (day.id === 0 ? ' visible' : '');
  wrapper.id = 'day-' + day.id;

  let html = `<div class="day-header-card ${day.color}">
    <div class="day-label">${day.label}</div>
    <div class="day-main-title">${day.title}</div>
    <div class="day-emoji-row">${day.emojis}</div>
  </div>`;

  day.sections.forEach(sec => {
    html += `<div class="section-title">${sec.title}</div>`;
    sec.items.forEach(item => {
      const tagsHtml = item.tags.map(t => `<span class="item-tag tag-${t}">${tagLabel(t)}</span>`).join('');
      const subHtml = item.sub ? item.sub.split('\n').join('<br>') : '';
      html += `<div class="item-card ${item.type}">
        <div class="item-time">${item.time}</div>
        <div class="item-body">
          <div class="item-title">${item.icon} ${item.title}</div>
          ${subHtml ? `<div class="item-sub">${subHtml}</div>` : ''}
          <div style="margin-top:4px">${tagsHtml}</div>
        </div>
      </div>`;
    });
  });

  if (day.navers && day.navers.length) {
    html += `<div class="naver-section"><div class="naver-header"><span>📍 Naver Map 快速查表</span><span class="copy-hint">點一下複製</span></div>`;
    day.navers.forEach(([place, name, note], idx) => {
      const flagged = name.includes('／') || name.includes('待確認');
      html += `<div class="naver-row" data-copy="${name.replace(/"/g, '&quot;')}">
        <div class="naver-place">${place}</div>
        <div class="naver-name">${flagged ? '<span class="naver-flag">⚠ </span>' : ''}${name}<br><span class="naver-note">${note}</span></div>
      </div>`;
    });
    html += `</div>`;
  }

  if (day.tip) {
    html += `<div class="bottom-tip">
      <div class="bottom-tip-title">${day.tip.title}</div>
      <div class="bottom-tip-text">${day.tip.text}</div>
    </div>`;
  }

  wrapper.innerHTML = html;
  container.appendChild(wrapper);

  wrapper.querySelectorAll('.naver-row').forEach(row => {
    row.addEventListener('click', () => copyText(row.getAttribute('data-copy')));
  });
});

function switchDay(id) {
  document.querySelectorAll('.day-btn').forEach((b, i) => b.classList.toggle('active', i === id));
  document.querySelectorAll('.day-content').forEach(c => c.classList.remove('visible'));
  document.getElementById('day-' + id).classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  nav.querySelectorAll('.day-btn')[id].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}
</script>
